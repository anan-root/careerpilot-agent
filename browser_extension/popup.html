<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerPilot</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 700;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: #475569;
    }
    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      margin-top: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px;
      font: inherit;
      background: #ffffff;
    }
    textarea {
      min-height: 130px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      font-weight: 650;
      cursor: pointer;
    }
    #capture {
      color: #0f172a;
      background: #e2e8f0;
    }
    #import {
      color: #ffffff;
      background: #2563eb;
    }
    #status {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <h1>CareerPilot 岗位导入</h1>
  <label for="title">岗位名称</label>
  <input id="title" type="text">
  <label for="company">公司名称</label>
  <input id="company" type="text">
  <div class="row">
    <div>
      <label for="location">地点</label>
      <input id="location" type="text">
    </div>
    <div>
      <label for="salary">薪资</label>
      <input id="salary" type="text">
    </div>
  </div>
  <label for="url">链接</label>
  <input id="url" type="text">
  <label for="jd">页面文本 / JD</label>
  <textarea id="jd"></textarea>
  <div class="actions">
    <button id="capture" type="button">读取当前页</button>
    <button id="bookmark" type="button">收藏</button>
    <button id="import" type="button">导入</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
